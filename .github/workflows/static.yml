# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    env:
      GA_MEASUREMENT_ID: G-F8HVYVW05H

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject Google Analytics 4
        run: |
          if [[ ! "$GA_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]]; then
            echo "Invalid Google Analytics measurement ID"
            exit 1
          fi

          export GA_ID="$GA_MEASUREMENT_ID"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          ga_id = os.environ["GA_ID"]

          script = f"""
          <!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={ga_id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{ga_id}');
          </script>
          """

          count = 0

          for path in Path(".").glob("*.html"):
              # Google verification files are excluded
              if path.name.startswith("google"):
                  continue

              html = path.read_text(encoding="utf-8")

              # Prevent duplicate Google Analytics tags
              if "googletagmanager.com/gtag/js" in html:
                  print(f"Skipped (GA already exists): {path}")
                  continue

              # Insert Google Analytics immediately after the opening head tag
              match = re.search(r"<head(?:\s[^>]*)?>", html, re.IGNORECASE)

              if not match:
                  print(f"Skipped (no head): {path}")
                  continue

              html = html[:match.end()] + "\n" + script + html[match.end():]
              path.write_text(html, encoding="utf-8")
              count += 1

          print(f"Google Analytics added to {count} HTML files.")
          PY

      - name: Inject FQDN normalization script
        run: |
          # 全てのHTMLファイルの<head>直後に挿入
          find . -maxdepth 1 -name "*.html" -not -name "google*.html" -exec sed -i '/<head>/a \  <script>if(window.location.hostname.endsWith(".")){window.location.replace(window.location.href.replace(window.location.hostname,window.location.hostname.slice(0,-1)));}</script>' {} +

      - name: Remove sensitive files from deployment artifact
        run: |
          # デプロイ対象から削除
          rm -rf functions README.md README readme.md license LICENSE LICENSE.txt _redirects.md _redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4